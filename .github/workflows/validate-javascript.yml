name: Validate JavaScript
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server JavaScript syntax
        run: |
          find api -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check inline JavaScript in index.html
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script\\s*>/gi)];
          if (!scripts.length) throw new Error('No inline script blocks found');
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'shakil-inline-'));
          for (let i = 0; i < scripts.length; i++) {
            const file = path.join(dir, 'inline-' + i + '.js');
            fs.writeFileSync(file, scripts[i][1]);
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write(result.stderr || result.stdout);
              process.exit(result.status || 1);
            }
          }
          console.log('Validated ' + scripts.length + ' inline script block(s).');
          NODE
